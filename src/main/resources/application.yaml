spring:
  application:
    name: ms-pokemon-storage
  datasource:
    url: jdbc:postgresql://localhost:5432/pokemon_db
    username: postgres
    password: admin123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: 8082

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.springframework.web.servlet.DispatcherServlet: WARN
